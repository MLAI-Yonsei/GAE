[project]
name = "gae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "torch==2.8.0",
    "tqdm>=4.70.1",
    "transformer-lens>=1.0.0",
    "transformers>=4.20.0",
    "wandb>=0.31.0",
]

[project.scripts]
